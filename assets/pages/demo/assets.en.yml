page_title: Assets
page_icon: ph:bold/files

breakpoints:
  title: Breakpoints
  body: >
    We use a standardized and customizable approach to breakpoints, defining a wide range of specific screen
    dimensions. Each screen category triggers the loading of dedicated CSS and JavaScript files, optimizing
    display and functionality for the user.
    <br><br>This example illustrates the process with a color change that occurs when the stylesheet matching
    the current screen size is loaded. You can test different breakpoints by resizing your browser window.
    <br><br>The system efficiently loads both CSS stylesheets and JavaScript code, the latter having specific
    syntax to handle graceful loading and unloading of scripts.
  body_js: >
    Resource loading is mainly orchestrated via JavaScript, avoiding preemptive loading of CSS files that
    wouldn't be needed. If JavaScript is disabled, the architecture automatically falls back to an alternative
    method using media queries in style tags. For a demo without JavaScript, see the
    <a href="?no_js=1">no-JavaScript version</a>.
  body_no_js: >
    Without JavaScript, stylesheet loading is handled directly by the browser using the "media" attribute on
    link tags. This means all stylesheets are loaded at page start to ensure a consistent user experience.
    <br><br>To compare, visit the <a href="?no_js">JavaScript version</a>.

infos:
  layout_name: Layout
